<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-label="Quote: Make it work, make it right, make it fast. - Kent Beck">
  <rect x="0.5" y="0.5" width="494" height="194" rx="4.5" fill="#0D1117" stroke="#FF6B35"/>
  <g font-family="Georgia, 'Times New Roman', serif">
    <text x="30" y="66" font-size="64" fill="#FF6B35" opacity="0.30" font-family="Georgia, serif">&#8220;</text>
    <text x="247" y="65" font-size="19" font-style="italic" fill="#F5E6CC" text-anchor="middle">Make it work, make it right, make it</text><text x="247" y="92" font-size="19" font-style="italic" fill="#F5E6CC" text-anchor="middle">fast.</text>
    <text x="247" y="162" font-size="11" fill="#FFB454" text-anchor="middle" letter-spacing="1">- KENT BECK</text>
    <text x="18" y="183" font-size="8" fill="#8B949E" letter-spacing="1">WEEK 46 &#183; ONE LINE AT A TIME</text>
