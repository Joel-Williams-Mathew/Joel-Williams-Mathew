<svg width="1200" height="60" viewBox="0 0 1200 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technology strip: Python, PyTorch, TensorFlow, Scikit-learn, LangChain, Ollama, Hugging Face, NumPy, Pandas, Flutter, React, MySQL, Firebase, Git, Linux">
  <rect width="1200" height="60" fill="#0B0B0B"/>
  <line x1="0" y1="0" x2="1200" y2="0" stroke="#242424" stroke-width="1"/>
  <line x1="0" y1="59" x2="1200" y2="59" stroke="#242424" stroke-width="1"/>

  <!-- scrolling tech marquee; duplicated set for seamless loop -->
  <g font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" font-weight="600" fill="#B8B8B8" letter-spacing="1">
    <g>
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-620 0" dur="22s" repeatCount="indefinite"/>
      <text x="20" y="38">Python</text>
      <text x="120" y="38" fill="#FF6B35">·</text>
      <text x="146" y="38">PyTorch</text>
      <text x="250" y="38" fill="#FF6B35">·</text>
      <text x="276" y="38">TensorFlow</text>
      <text x="404" y="38" fill="#FF6B35">·</text>
      <text x="430" y="38">Scikit-learn</text>
      <text x="552" y="38" fill="#FF6B35">·</text>
      <text x="578" y="38">LangChain</text>
      <text x="694" y="38" fill="#FF6B35">·</text>
      <text x="720" y="38">Ollama</text>
      <text x="812" y="38" fill="#FF6B35">·</text>
      <text x="838" y="38">Hugging Face</text>
      <text x="978" y="38" fill="#FF6B35">·</text>
      <text x="1004" y="38">NumPy</text>
      <text x="1094" y="38" fill="#FF6B35">·</text>
      <text x="1120" y="38">Pandas</text>
      <text x="1210" y="38" fill="#FF6B35">·</text>
      <text x="1236" y="38">Flutter</text>
      <text x="1330" y="38" fill="#FF6B35">·</text>
      <text x="1356" y="38">React</text>
      <text x="1438" y="38" fill="#FF6B35">·</text>
      <text x="1464" y="38">MySQL</text>
      <text x="1556" y="38" fill="#FF6B35">·</text>
      <text x="1582" y="38">Firebase</text>
      <text x="1690" y="38" fill="#FF6B35">·</text>
      <text x="1716" y="38">Git</text>
      <text x="1768" y="38" fill="#FF6B35">·</text>
      <text x="1794" y="38">Linux</text>
    </g>
  </g>

  <!-- edge fades -->
  <linearGradient id="fl" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#0B0B0B" stop-opacity="1"/>
    <stop offset="1" stop-color="#0B0B0B" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fr" x1="1" y1="0" x2="0" y2="0">
    <stop offset="0" stop-color="#0B0B0B" stop-opacity="1"/>
    <stop offset="1" stop-color="#0B0B0B" stop-opacity="0"/>
  </linearGradient>
  <rect x="0" y="0" width="120" height="60" fill="url(#fl)"/>
  <rect x="1080" y="0" width="120" height="60" fill="url(#fr)"/>
</svg>
