<svg width="1400" height="470" viewBox="0 0 1400 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Horizontal lockup — Joel Williams, AI and Data Science">
  <rect width="1400" height="470" fill="#0B0B0B"/>

  <!-- copper hairline grid -->
  <g stroke="#2A2A2A" stroke-width="1">
    <line x1="0" y1="1" x2="1400" y2="1"/>
    <line x1="0" y1="469" x2="1400" y2="469"/>
    <line x1="1" y1="0" x2="1" y2="470"/>
    <line x1="1399" y1="0" x2="1399" y2="470"/>
  </g>

  <!-- kicker row -->
  <text x="70" y="78" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="7" fill="#8A8A8A">AI &amp; DATA SCIENCE ENGINEER</text>
  <text x="1330" y="78" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="7" fill="#8A8A8A">KOZHIKODE, IN</text>

  <!-- hairline -->
  <line x1="70" y1="104" x2="1330" y2="104" stroke="#3A3A3A" stroke-width="1"/>

  <!-- horizontal lockup: JOEL | WILLIAMS -->
  <text x="64" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="184" letter-spacing="-8" fill="#F5F5F5">JOEL</text>
  <text x="640" y="290" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-weight="700" font-size="184" letter-spacing="-8" fill="#F5F5F5">WILLIAMS</text>

  <!-- copper underline that draws itself -->
  <line x1="70" y1="330" x2="700" y2="330" stroke="#C2410C" stroke-width="6" stroke-dasharray="630" stroke-dashoffset="630">
    <animate attributeName="stroke-dashoffset" from="630" to="0" dur="1.4s" fill="freeze"/>
  </line>

  <!-- facts strip -->
  <text x="70" y="382" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#C2410C" font-weight="600">NASA SPACE APPS 2025 — GLOBAL NOMINEE</text>
  <text x="70" y="410" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="15" fill="#8A8A8A">ML INTERN @ COGNIFYZ &amp; PACELAB — B.TECH AI &amp; DS @ SJCET, PALAI</text>

  <!-- corner mark -->
  <text x="1330" y="410" text-anchor="end" font-family="'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" letter-spacing="5" fill="#5A5A5A">EST. 2026</text>
</svg>
