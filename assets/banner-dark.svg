<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Joel Williams Mathew — AI &amp; ML Engineer, Cinematic Builder</title>
  <defs>
    <radialGradient id="bg" cx="0.16" cy="0.9" r="1.15">
      <stop offset="0" stop-color="#26190A"/>
      <stop offset="0.45" stop-color="#151009"/>
      <stop offset="1" stop-color="#0D1117"/>
    </radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.4" fill="#21262D"/>
    </pattern>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFE1A6"/>
      <stop offset="0.4" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="jwgrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE3A6"/>
      <stop offset="0.45" stop-color="#FFB454"/>
      <stop offset="1" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#dots)" opacity="0.8"/>

  <!-- kicker -->
  <text x="70" y="46" font-family="'Courier New', Courier, monospace" font-size="13" letter-spacing="5" fill="#8B949E">NASA SPACE APPS 2025 &#183; GLOBAL NOMINEE</text>

  <!-- wordmark -->
  <text x="66" y="128" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="92" letter-spacing="6" fill="#F5F1E8">JOEL</text>
  <text x="66" y="222" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="80" letter-spacing="4" fill="#F5F1E8">WILLIAMS</text>

  <!-- amber rule -->
  <line x1="70" y1="238" x2="560" y2="238" stroke="url(#rule)" stroke-width="3.5"/>

  <!-- tagline -->
  <text x="70" y="268" font-family="'Courier New', Courier, monospace" font-size="14.5" letter-spacing="4.2" fill="#FFB454">AI &amp; ML ENGINEER &#8212; CINEMATIC BUILDER</text>

  <!-- monogram ring -->
  <circle cx="1015" cy="152" r="94" fill="none" stroke="#FFB454" stroke-width="2.5" stroke-dasharray="5 9" stroke-opacity="0.9"/>
  <circle cx="1015" cy="152" r="74" fill="none" stroke="#B45309" stroke-width="1.5" stroke-opacity="0.7"/>
  <line x1="1015" y1="34" x2="1015" y2="48" stroke="#FFB454" stroke-width="3"/>
  <line x1="1015" y1="256" x2="1015" y2="270" stroke="#FFB454" stroke-width="3"/>
  <line x1="897" y1="152" x2="911" y2="152" stroke="#FFB454" stroke-width="3"/>
  <line x1="1119" y1="152" x2="1133" y2="152" stroke="#FFB454" stroke-width="3"/>
  <text x="1015" y="176" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-weight="700" font-size="88" fill="url(#jwgrad)">JW</text>
</svg>
