<svg width="1400" height="440" viewBox="0 0 1400 440" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Monograph — Joel Williams</title>
  <rect width="1400" height="440" fill="#FFFFFF"/>

  <!-- nameplate double rule -->
  <rect x="0" y="14" width="1400" height="7" fill="#111111"/>
  <rect x="0" y="28" width="1400" height="1.5" fill="#111111"/>

  <!-- small caps -->
  <text x="56" y="84" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="8" fill="#111111">MONOGRAPH</text>
  <text x="56" y="110" font-family="'Courier New', Courier, monospace" font-size="9.5" letter-spacing="5" fill="#C2410C">VOL. I · 2026</text>
  <text x="1344" y="84" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="14" letter-spacing="8" fill="#111111">NO. 001</text>
  <text x="1344" y="110" text-anchor="end" font-family="'Courier New', Courier, monospace" font-size="9.5" letter-spacing="5" fill="#C2410C">KOZHIKODE</text>

  <!-- massive sans name -->
  <text x="50" y="240" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="126" letter-spacing="-2" fill="#111111">JOEL</text>
  <text x="50" y="372" font-family="'Arial Black', Arial, sans-serif" font-weight="900" font-size="118" letter-spacing="-2" fill="#111111">WILLIAMS</text>

  <!-- subtitle strip -->
  <text x="56" y="410" font-family="'Courier New', Courier, monospace" font-size="12.5" letter-spacing="3" fill="#C2410C">AI &amp; DATA SCIENCE · SJCET · NASA SPACE APPS 2025 NOMINEE</text>

  <!-- copper rule drawing itself -->
  <line x1="0" y1="428" x2="1400" y2="428" stroke="#C2410C" stroke-width="5" stroke-dasharray="1400" stroke-dashoffset="1400">
    <animate attributeName="stroke-dashoffset" from="1400" to="0" dur="1.6s" fill="freeze"/>
  </line>
</svg>
