<svg width="1400" height="680" viewBox="0 0 1400 680" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>neofetch — jomu@joel</title>
  <defs>
    <pattern id="bgDots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.4" cy="1.4" r="1.2" fill="#101825"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7EE787" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#7EE787" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7EE787" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <rect width="1400" height="680" fill="#050A14"/>
  <rect width="1400" height="680" fill="url(#bgDots)" opacity="0.9"/>

  <!-- window chrome reveal -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.45s" fill="freeze"/>
    <rect x="20" y="20" width="1360" height="640" rx="14" fill="#0D1117" stroke="#1F2937" stroke-width="2"/>
    <circle cx="52" cy="52" r="9" fill="#FF5F57"/>
    <circle cx="80" cy="52" r="9" fill="#FEBC2E"/>
    <circle cx="108" cy="52" r="9" fill="#28C840"/>
    <text x="700" y="58" text-anchor="middle" font-family="'Courier New', Courier, monospace" font-size="17" letter-spacing="2" fill="#8B949E">jomu@joel: ~ — neofetch</text>
    <line x1="40" y1="76" x2="1360" y2="76" stroke="#1F2937" stroke-width="2"/>
  </g>

  <!-- scan sweep, loops forever -->
  <rect x="-240" y="20" width="150" height="640" fill="url(#scan)" opacity="0.8">
    <animate attributeName="x" values="-240;1500" dur="4.5s" repeatCount="indefinite"/>
  </rect>

  <!-- prompt reveals -->
