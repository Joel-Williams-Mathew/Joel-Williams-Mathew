    <text x="55" y="235" opacity="0" transform="translate(0 24)"><animate attributeName="opacity" from="0" to="1" begin="0.65s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.65s" dur="0.35s" fill="freeze"/>     ██╗ ██████╗ ███╗   ███╗██╗   ██╗</text>
