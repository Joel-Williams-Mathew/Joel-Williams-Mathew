    <text x="55" y="600" font-family="'Courier New', Courier, monospace" font-size="22" font-weight="700"><tspan fill="#56B6C2">jomu@joel</tspan><tspan fill="#E8F4FF">:~$ </tspan></text>
    <rect x="202" y="580" width="18" height="26" fill="#7EE787">
