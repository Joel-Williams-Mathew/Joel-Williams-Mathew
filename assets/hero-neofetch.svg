    <text x="625" y="566" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#56B6C2">GitHub:           </tspan><tspan fill="#E8F4FF">github.com/Joel-Williams-Mathew</tspan></text>
    <text x="625" y="592" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#56B6C2">LinkedIn:         </tspan><tspan fill="#E8F4FF">linkedin.com/in/joel-williams-97b375272</tspan></text>
    <text x="625" y="618" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#56B6C2">Stack:            </tspan><tspan fill="#E8F4FF">PyTorch · TensorFlow · LangChain · Ollama</tspan></text>
