    <text x="60" y="118" font-family="'Courier New', Courier, monospace" font-size="20" font-weight="700"><tspan fill="#56B6C2">jomu@joel</tspan><tspan fill="#E8F4FF">:~$ neofetch</tspan></text>
  </g>

