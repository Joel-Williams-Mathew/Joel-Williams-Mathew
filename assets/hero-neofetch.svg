    <animateTransform attributeName="transform" type="translate" from="0 14" to="0 0" begin="1.6s" dur="0.5s" fill="freeze"/>
    <text x="625" y="488" font-family="'Courier New', Courier, monospace" font-size="15" fill="#3E4A5F">────────────────────────────</text>
