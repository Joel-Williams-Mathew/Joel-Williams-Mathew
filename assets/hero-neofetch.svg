    <text x="55" y="341" opacity="0" transform="translate(0 24)"><animate attributeName="opacity" from="0" to="1" begin="0.91s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="0.91s" dur="0.35s" fill="freeze"/>     ██║██║   ██║██╔████╔██║██║   ██║</text>
    <text x="55" y="394" opacity="0" transform="translate(0 24)"><animate attributeName="opacity" from="0" to="1" begin="1.04s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="1.04s" dur="0.35s" fill="freeze"/>██   ██║██║   ██║██║╚██╔╝██║██║   ██║</text>
    <text x="55" y="447" opacity="0" transform="translate(0 24)"><animate attributeName="opacity" from="0" to="1" begin="1.17s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="1.17s" dur="0.35s" fill="freeze"/>╚█████╔╝╚██████╔╝██║ ╚═╝ ██║╚██████╔╝</text>
    <text x="55" y="500" opacity="0" transform="translate(0 24)"><animate attributeName="opacity" from="0" to="1" begin="1.3s" dur="0.35s" fill="freeze"/><animateTransform attributeName="transform" type="translate" from="0 24" to="0 0" begin="1.3s" dur="0.35s" fill="freeze"/> ╚════╝  ╚═════╝ ╚═╝     ╚═╝ ╚═════╝</text>
  </g>

