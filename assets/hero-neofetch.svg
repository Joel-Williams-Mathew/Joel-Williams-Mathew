    <text x="625" y="436" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#E5C07B">Hobbies.Software: </tspan><tspan fill="#E8F4FF">DUM-E · GNNs</tspan></text>
    <text x="625" y="462" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#E5C07B">Hobbies.Hardware: </tspan><tspan fill="#E8F4FF">Himalayan 450 · Photography</tspan></text>
  </g>
  <g opacity="0" transform="translate(0 14)">
