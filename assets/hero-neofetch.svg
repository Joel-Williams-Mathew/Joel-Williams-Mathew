    <text x="625" y="228" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#56B6C2">Host:             </tspan><tspan fill="#E8F4FF">Joel Williams Mathew — Kozhikode, IN</tspan></text>
    <text x="625" y="254" font-family="'Courier New', Courier, monospace" font-size="15"><tspan fill="#56B6C2">Kernel:           </tspan><tspan fill="#E8F4FF">NASA Space Apps 2025 — Global Nominee</tspan></text>
