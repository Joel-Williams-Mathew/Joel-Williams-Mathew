<svg width="1200" height="26" viewBox="0 0 1200 26" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Divider">
  <defs>
    <linearGradient id="ln" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2937" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#1F2937"/>
      <stop offset="0.85" stop-color="#1F2937"/>
      <stop offset="1" stop-color="#1F2937" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="pl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFB454" stop-opacity="1"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE1A6"/>
      <stop offset="0.35" stop-color="#FFB454" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <line x1="40" y1="13" x2="1160" y2="13" stroke="url(#ln)" stroke-width="1.5"/>

  <!-- travelling comet -->
  <g>
    <animateTransform attributeName="transform" type="translate" from="0 0" to="1200 0" dur="4.2s" repeatCount="indefinite"/>
    <circle cx="-6" cy="13" r="9" fill="url(#dot)"/>
    <rect x="-52" y="11.8" width="46" height="2.4" rx="1.2" fill="url(#pl)"/>
  </g>

  <!-- static centre diamond that breathes -->
  <g transform="translate(600,13)">
    <rect x="-5" y="-5" width="10" height="10" fill="#FFB454" transform="rotate(45)" opacity="0.9">
      <animate attributeName="opacity" values="0.35;1;0.35" dur="3s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- edge ticks -->
  <line x1="40" y1="8" x2="40" y2="18" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
  <line x1="1160" y1="8" x2="1160" y2="18" stroke="#FF6B35" stroke-width="1.5" opacity="0.6"/>
</svg>
