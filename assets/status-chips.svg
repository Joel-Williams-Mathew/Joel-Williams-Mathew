<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Currently building: DUM-E in development, GNNs training, NASA Space Apps nominee, ML pipelines shipping, Flutter building">
  <defs>
    <linearGradient id="chipBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#161B22"/>
      <stop offset="1" stop-color="#1A1F27"/>
    </linearGradient>
    <radialGradient id="chipGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FF6B35" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF6B35" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="300" fill="none"/>

  <!-- ROW 1 -->
  <!-- DUM-E : IN DEV — pulsing -->
  <g>
    <rect x="10" y="14" width="578" height="76" rx="10" fill="url(#chipBg)" stroke="#2A313A" stroke-width="1.5"/>
    <rect x="10" y="14" width="578" height="76" rx="10" fill="url(#chipGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <text x="34" y="60" font-family="'Segoe UI Emoji', sans-serif" font-size="26">🔊</text>
    <text x="76" y="50" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5E6CC">DUM-E</text>
    <text x="76" y="72" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">Voice-first desktop automation · PyAutoGUI + TTS</text>
    <circle cx="524" cy="52" r="5" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <text x="566" y="57" text-anchor="end" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FFB454">IN DEV</text>
  </g>

  <!-- GNNs : TRAINING — pulsing -->
  <g>
    <rect x="612" y="14" width="578" height="76" rx="10" fill="url(#chipBg)" stroke="#2A313A" stroke-width="1.5"/>
    <rect x="612" y="14" width="578" height="76" rx="10" fill="url(#chipGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.55;0" dur="3.1s" begin="0.6s" repeatCount="indefinite"/>
    </rect>
    <text x="636" y="60" font-family="'Segoe UI Emoji', sans-serif" font-size="26">🧠</text>
    <text x="678" y="50" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5E6CC">GNNs</text>
    <text x="678" y="72" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">Neuroevolution running live inside Pygame</text>
    <circle cx="1126" cy="52" r="5" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" begin="0.3s" repeatCount="indefinite"/>
    </circle>
    <text x="1168" y="57" text-anchor="end" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FFB454">TRAINING</text>
  </g>

  <!-- ROW 2 -->
  <!-- NASA : NOMINEE — bright steady glow -->
  <g>
    <rect x="10" y="110" width="578" height="76" rx="10" fill="url(#chipBg)" stroke="#3A2E1C" stroke-width="1.5"/>
    <rect x="10" y="110" width="578" height="76" rx="10" fill="url(#chipGlow)" opacity="0">
      <animate attributeName="opacity" values="0.1;0.8;0.1" dur="4s" begin="0.2s" repeatCount="indefinite"/>
    </rect>
    <text x="34" y="156" font-family="'Segoe UI Emoji', sans-serif" font-size="26">🌍</text>
    <text x="76" y="146" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5E6CC">NASA Space Apps 2025</text>
    <text x="76" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">Deadline engineering, finished first</text>
    <circle cx="524" cy="148" r="5" fill="#FFE1A6">
      <animate attributeName="r" values="4;6.5;4" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="566" y="153" text-anchor="end" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FFE1A6">NOMINEE</text>
  </g>

  <!-- ML Pipelines : SHIPPING — steady -->
  <g>
    <rect x="612" y="110" width="578" height="76" rx="10" fill="url(#chipBg)" stroke="#2A313A" stroke-width="1.5"/>
    <rect x="612" y="110" width="578" height="76" rx="10" fill="url(#chipGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.4;0" dur="3.4s" begin="1.1s" repeatCount="indefinite"/>
    </rect>
    <text x="636" y="156" font-family="'Segoe UI Emoji', sans-serif" font-size="26">📊</text>
    <text x="678" y="146" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5E6CC">ML Pipelines</text>
    <text x="678" y="168" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">Raw CSV › Jupyter › recommendation logic</text>
    <circle cx="1126" cy="148" r="5" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" begin="0.9s" repeatCount="indefinite"/>
    </circle>
    <text x="1168" y="153" text-anchor="end" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FFB454">SHIPPING</text>
  </g>

  <!-- ROW 3 -->
  <!-- Flutter : BUILDING -->
  <g>
    <rect x="10" y="206" width="578" height="76" rx="10" fill="url(#chipBg)" stroke="#2A313A" stroke-width="1.5"/>
    <rect x="10" y="206" width="578" height="76" rx="10" fill="url(#chipGlow)" opacity="0">
      <animate attributeName="opacity" values="0;0.45;0" dur="2.9s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
    <text x="34" y="252" font-family="'Segoe UI Emoji', sans-serif" font-size="26">📱</text>
    <text x="76" y="242" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#F5E6CC">Flutter Full-Stack</text>
    <text x="76" y="264" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#8B949E">UI built on real business logic</text>
    <circle cx="524" cy="244" r="5" fill="#FF6B35">
      <animate attributeName="opacity" values="1;0.2;1" dur="1.7s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <text x="566" y="249" text-anchor="end" font-family="'Courier New', monospace" font-size="12" font-weight="700" fill="#FFB454">BUILDING</text>
  </g>
</svg>
