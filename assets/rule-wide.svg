<svg width="1200" height="18" viewBox="0 0 1200 18" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
  <defs>
    <linearGradient id="dg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1A1A1A"/>
      <stop offset="0.5" stop-color="#3A3A3A"/>
      <stop offset="1" stop-color="#1A1A1A"/>
    </linearGradient>
    <linearGradient id="dp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C2410C" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FF8A3D" stop-opacity="1"/>
      <stop offset="1" stop-color="#C2410C" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <line x1="0" y1="9" x2="1200" y2="9" stroke="url(#dg)" stroke-width="1.5"/>
  <rect x="-160" y="7" width="160" height="4" fill="url(#dp)">
    <animate attributeName="x" values="-160;1200" dur="3.4s" repeatCount="indefinite"/>
  </rect>
  <circle cx="600" cy="9" r="3.5" fill="#FF6B35">
    <animate attributeName="r" values="3.5;5;3.5" dur="2.2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.5;1" dur="2.2s" repeatCount="indefinite"/>
  </circle>
</svg>
