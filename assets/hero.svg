<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Joel Williams — AI &amp; ML Engineering · The Dossier</title>
  <defs>
    <pattern id="grain" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#E0D9C7"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" fill="#F6F1E7"/>
  <rect width="1200" height="400" fill="url(#grain)" opacity="0.85"/>

  <!-- top double rule -->
  <rect x="0" y="14" width="1200" height="4" fill="#161311"/>
  <rect x="0" y="26" width="1200" height="1.5" fill="#161311"/>

  <!-- kicker row -->
  <text x="34" y="52" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="17" letter-spacing="6" fill="#161311">EST. 2026</text>
  <text x="1166" y="52" text-anchor="end" font-family="'Courier New', Courier, monospace" font-weight="700" font-size="17" letter-spacing="6" fill="#161311">VOL. I &#8212; NO. 1</text>

  <!-- rotating asterisk -->
  <g transform="translate(600 42)">
    <text x="0" y="7" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="34" fill="#E4572E">
      &#10035;<animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="9s" repeatCount="indefinite"/>
    </text>
  </g>

  <!-- masthead -->
  <text x="34" y="190" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" letter-spacing="-2" fill="#161311">JOEL</text>
  <text x="34" y="338" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="150" letter-spacing="-2" fill="#161311">WILLIAMS<tspan fill="#E4572E">.</tspan></text>

  <!-- bottom double rule -->
  <rect x="0" y="362" width="1200" height="1.5" fill="#161311"/>
  <rect x="0" y="372" width="1200" height="4" fill="#161311"/>
</svg>
