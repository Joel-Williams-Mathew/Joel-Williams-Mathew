name: Generate stats card

# Self-hosted stats card (Total Commits / PRs / Stars) as stats.svg on main.
# Public data only with GITHUB_TOKEN; with a repo secret GH_TOKEN (repo scope)
# it also counts private repos. Refresh locally anytime with:
#   python scripts/stats_card.py   (with GH_TOKEN set)

on:
  schedule:
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/stats_card.py
      - .github/workflows/stats.yml

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate stats.svg
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: Joel-Williams-Mathew
        run: python3 scripts/stats_card.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update stats card [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
