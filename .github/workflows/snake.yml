name: Generate contribution snake

# Generates the animated contribution-grid snake SVG used in README.md.
# Output is pushed to the `output` branch of THIS repo (Joel-Williams-Mathew/Joel-Williams-Mathew).
# After pushing, enable it: Actions tab → "Generate contribution snake" → Run workflow.

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate daily at 00:00 UTC
  workflow_dispatch:        # allow manual runs
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Joel-Williams-Mathew
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
