name: Generate contribution snake

# Generates the animated contribution-grid snake SVG used in README.md.
# Output is published ADDITIVELY to the `output` branch (never deletes
# other files such as the stats cards generated by stats.yml).

on:
  schedule:
    - cron: "0 0 * * *"   # regenerate daily at 00:00 UTC
  workflow_dispatch:        # allow manual runs
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: publish-output
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate snake SVGs (light + dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Joel-Williams-Mathew
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Publish to output branch (additive)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin output
          git checkout output
          cp dist/github-contribution-grid-snake.svg dist/github-contribution-grid-snake-dark.svg .
          git add github-contribution-grid-snake.svg github-contribution-grid-snake-dark.svg
          git commit -m "chore: update snake" || echo "no changes to commit"
          git push origin output
