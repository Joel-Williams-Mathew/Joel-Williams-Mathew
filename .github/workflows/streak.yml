name: Update streak card

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/streak_card.py
      - scripts/make_streak_json.py
      - .github/workflows/streak.yml

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak.svg
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: Joel-Williams-Mathew
          ACCOUNT_START: "2024-08-26"
        run: python3 scripts/streak_card.py

      - name: Generate streak.json
        run: python3 scripts/make_streak_json.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg streak.json
          if git diff --staged --quiet; then
            echo "no change this hour"
          else
            git commit -m "chore: update streak card [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
