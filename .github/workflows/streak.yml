name: Update streak card

on:
  schedule:
    - cron: "20 0 * * *"      # daily at 00:20 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/streak_card.py
      - .github/workflows/streak.yml

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak.svg
        env:
          # GH_TOKEN is a personal access token that can read private
          # contribution counts. Falls back to the default token, which only
          # sees public data.
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: Joel-Williams-Mathew
          ACCOUNT_START: "2024-08-26"
        run: python3 scripts/streak_card.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: update streak card"
            git pull --rebase origin main || true
            git push
          fi
