name: Update streak card

on:
  schedule:
    - cron: "5 * * * *"       # every hour at :05
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/streak_card.py
      - .github/workflows/streak.yml

permissions:
  contents: write

concurrency:
  group: streak
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate streak.svg
        env:
          # optional: a token that can read private contribution counts
          GH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          GH_USER: Joel-Williams-Mathew
          ACCOUNT_START: "2024-08-26"
        run: python3 scripts/streak_card.py

      # also publish a machine-readable copy for the portfolio site to fetch
      - name: Write streak.json
        run: |
          python3 - <<'PY'
          import json, re, pathlib
          svg = pathlib.Path("streak.svg").read_text(encoding="utf-8")
          vals = re.findall(r">([^<>\n]+)</text>", svg)
          feet = re.findall(r">([^<>\n]+)</text>", svg)
          nums = [v.strip() for v in vals if v.strip().isdigit()]
          data = {
              "total": int(nums[0]) if len(nums) > 0 else None,
              "current": int(nums[1]) if len(nums) > 1 else None,
              "longest": int(nums[2]) if len(nums) > 2 else None,
          }
          pathlib.Path("streak.json").write_text(json.dumps(data) + "\n", encoding="utf-8")
          print("streak.json ->", data)
          PY

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add streak.svg streak.json
          if git diff --staged --quiet; then
            echo "no change this hour"
          else
            git commit -m "chore: update streak card [skip ci]"
            git pull --rebase origin main || true
            git push
          fi
